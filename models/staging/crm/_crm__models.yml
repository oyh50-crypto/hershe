version: 2

models:
  - name: stg_crm__cafe24_order_items
    description: >
      One row per Cafe24 order item, deduplicated to the latest snapshot and
      type-cast. Amounts are bucketed into gross / points+coupons / discounts so
      that downstream models can add them back to the list price.
    columns:
      - name: order_item_code
        description: Cafe24 order item code — natural key.
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: gross_amount
        description: Order product amount apportioned to this item, before any discount.
        tests:
          - not_null
      - name: item_paid_amount
        description: >
          Apportioned payment less apportioned shipping — the item's real net paid
          amount. Validated against order totals; items_payment_amount is NOT this
          figure (it matched on 5 of 9437 rows) and is deliberately not exposed.
        tests:
          - not_null
      - name: point_coupon_used_amount
        description: >
          Points spent plus the order-level coupon discount, apportioned.
          items_coupon_discount_price is excluded — it is zero on every row.
      - name: component_discount_amount
        description: >
          Membership tier, product-level additional and app discounts summed from
          the raw columns. Reproduces the mart's residual on ~90% of rows; kept for
          monitoring rather than used directly.
