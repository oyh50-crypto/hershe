version: 2

models:
  - name: stg_crm__cafe24_order_items
    description: >
      One row per Cafe24 order item, deduplicated to the latest snapshot and
      type-cast. Amounts are bucketed into gross / points+coupons / discounts so
      that downstream models can add them back to the list price.
    columns:
      - name: order_item_code
        description: Cafe24 order item code — natural key.
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: item_gross_amount
        description: >
          Order list amount apportioned to this item by its share of the order.
        tests:
          - not_null
      - name: point_coupon_used_amount
        description: >
          Points spent plus the order-level coupon discount, apportioned.
          items_coupon_discount_price is excluded — it is zero on every row.
      - name: discount_amount
        description: >
          Apportioned membership tier discount plus this item's own additional and
          app discounts. The item-level ones are totals, not per-unit amounts.
      - name: order_payment_amount
        description: >
          Order-level payment amount, repeated on every item row of the order — it
          is NOT apportioned. items_payment_amount and div_payment_amount are not
          used: no candidate definition for either matched the data.
