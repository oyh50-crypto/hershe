version: 2

sources:
  - name: crm
    database: "{{ var('crm_project') }}"
    schema: "{{ var('crm_dataset') }}"
    tables:
      - name: orders
        description: >
          CRM/order system export — the source of truth for order status and
          amounts. Column names are placeholders — adjust to the real schema.

      - name: cafe24_orders
        identifier: "{{ var('crm_cafe24_orders_table') }}"
        description: >
          Cafe24 Admin API export, flattened so one row is one order item, with the
          product master and category names already denormalized onto each row.
          See docs/cafe24_crm_columns.md for the full column dictionary. Amounts
          arrive as strings; `*_divided` / `div_*` columns are order-level amounts
          apportioned across the order's items.
        columns:
          - name: items_order_item_code
            description: Order item code — the natural key of this table.
          - name: query_date
            description: API extraction date, not the order date. Snapshot/partition key.
          - name: TB_DATE
            description: Analysis date key supplied by the loader (expected to be the order date).
