version: 2

models:
  - name: stg_ga4__events
    description: One row per GA4 event, with commonly used event_params flattened into columns.
    columns:
      - name: session_id
        description: "Surrogate key: user_pseudo_id + ga_session_id."
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null

  - name: stg_ga4__event_items
    description: One row per item within an ecommerce GA4 event (view_item, add_to_cart, purchase, etc.).
