version: 2

models:
  - name: dim_date
    description: Calendar spine from 2020-01-01 to today.
    columns:
      - name: date
        tests:
          - unique
          - not_null

  - name: fct_sessions
    description: One row per GA4 session, with channel grouping and purchase outcome.
    columns:
      - name: session_id
        tests:
          - unique
          - not_null

  - name: fct_funnel_steps
    description: One row per session per ecommerce funnel step actually reached.
    columns:
      - name: session_id
        tests:
          - not_null
      - name: step_name
        tests:
          - not_null

  - name: mart_funnel_analysis
    description: >
      Daily funnel step-by-step session counts and conversion/drop-off rates,
      broken out by channel. Primary output for customer behavior/funnel analysis.
    columns:
      - name: sessions
        tests:
          - not_null

  - name: fct_orders
    description: One row per CRM order, enriched with GA4 channel attribution.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: mart_channel_performance
    description: Daily ad spend joined to session/conversion outcomes per channel (CPC, CVR, ROAS, CPA).

  - name: mart_cohort_retention
    description: >
      Cohort (first purchase month) x period_number (months since cohort) retention table.
      Long/tidy format — pivot into a triangle in the BI layer. Retention is defined as
      having a GA4 session in that month, which requires GA4 user_id to match the CRM
      customer_id (set on login).
    columns:
      - name: cohort_month
        tests:
          - not_null
      - name: period_number
        tests:
          - not_null

  - name: mart_order_items
    description: >
      Analysis-ready order item table. item_paid_amount, point_coupon_used_amount
      and discount_amount are mutually exclusive and sum to the item's list
      product amount.
    columns:
      - name: items_order_item_code
        tests:
          - unique
          - not_null
      - name: TB_DATE
        tests:
          - not_null
      - name: item_paid_amount
        tests:
          - not_null
